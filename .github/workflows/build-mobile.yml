name: Build iOS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      ios_export:
        description: "iOS output type"
        required: true
        default: "both"
        type: choice
        options:
          - ipa
          - simulator-app
          - both
      create_release:
        description: "Create or update GitHub Release with the output"
        required: false
        type: boolean
        default: true
      tag_name:
        description: "Release tag (e.g. 1.1.6-Beta or 1.1.0-Beta). Defaults to current tag, release tag, or project version."
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - '*'
  release:
    types: [published]

jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      IOS_SCHEME: LiquidPlayeriOS
      IOS_PROJECT: ios/LiquidPlayeriOS.xcodeproj
      IOS_BUNDLE_ID: com.bobjoerules.liquidplayer

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build simulator app
        if: ${{ inputs.ios_export == 'simulator-app' || inputs.ios_export == 'both' || github.event_name == 'push' || github.event_name == 'release' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-ios.log"

      - name: Build unsigned device app
        if: ${{ (inputs.ios_export || 'both') != 'simulator-app' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-ios.log"

      - name: Package simulator app
        if: ${{ inputs.ios_export == 'simulator-app' || inputs.ios_export == 'both' || github.event_name == 'push' || github.event_name == 'release' }}
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/Release-iphonesimulator/Liquid Player.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Simulator .app not found."
            exit 1
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/liquid-player-ios-simulator-app.zip

      - name: Package unsigned IPA and Device App
        if: ${{ (inputs.ios_export || 'both') != 'simulator-app' }}
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/Release-iphoneos/Liquid Player.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Device .app not found."
            exit 1
          fi
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/
          cd artifacts
          zip -r liquid-player.ipa Payload
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" liquid-player-ios-device-app.zip

      - name: Upload IPA artifact
        if: ${{ (inputs.ios_export || 'both') != 'simulator-app' }}
        uses: actions/upload-artifact@v4
        with:
          name: liquid-player-ipa
          path: artifacts/liquid-player.ipa

      - name: Upload simulator app
        if: ${{ inputs.ios_export == 'simulator-app' || inputs.ios_export == 'both' || github.event_name == 'push' || github.event_name == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: liquid-player-ios-simulator-app
          path: artifacts/liquid-player-ios-simulator-app.zip

      - name: Upload device app
        if: ${{ (inputs.ios_export || 'both') != 'simulator-app' }}
        uses: actions/upload-artifact@v4
        with:
          name: liquid-player-ios-device-app
          path: artifacts/liquid-player-ios-device-app.zip

      - name: Upload iOS build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild-ios.log

      - name: Determine Release Tag
        id: release_info
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_release != false }}
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG=""
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG=$(git tag --points-at HEAD | head -n 1)
            if [ -z "$TAG" ]; then
              VERSION=$(grep 'MARKETING_VERSION:' ios/project.yml | head -n 1 | awk '{print $2}')
              if [ -n "$VERSION" ]; then
                TAG="$VERSION-Beta"
              fi
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Create or Update GitHub Release
        if: ${{ steps.release_info.outputs.tag != '' && (github.event_name != 'workflow_dispatch' || inputs.create_release != false) }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/liquid-player.ipa
            artifacts/liquid-player-ios-simulator-app.zip
            artifacts/liquid-player-ios-device-app.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
